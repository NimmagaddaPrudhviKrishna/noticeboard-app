<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - College Notice Board</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="icon">📌</span>
    <div>
      <h1>College Notice Board</h1>
      <p>Admin Dashboard</p>
    </div>
  </div>
  <nav>
    <a href="index.html">View Board</a>
    <button class="link" id="logoutBtn" style="display:none;">Logout</button>
  </nav>
</header>

<main>

  <!-- Login panel -->
  <div class="login-wrap" id="loginPanel">
    <h2>Admin Login</h2>
    <div id="loginAlert"></div>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="admin" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <button class="btn" id="loginBtn">Login</button>
    <p class="hint">Default demo credentials — Username: <b>admin</b> &nbsp; Password: <b>admin123</b></p>
  </div>

  <!-- Dashboard (hidden until logged in) -->
  <div id="dashboard" style="display:none;">

    <div class="form-panel">
      <h2 id="formTitle">Post a New Notice</h2>
      <div id="formAlert"></div>
      <input type="hidden" id="editId" />
      <div class="form-grid">
        <div class="full">
          <label>Title</label>
          <input type="text" id="title" placeholder="e.g. Semester Exam Timetable Released" />
        </div>
        <div class="full">
          <label>Content</label>
          <textarea id="content" placeholder="Write the full announcement here..."></textarea>
        </div>
        <div>
          <label>Category</label>
          <select id="category">
            <option value="General">General</option>
            <option value="Academic">Academic</option>
            <option value="Exam">Exam</option>
            <option value="Event">Event</option>
            <option value="Placement">Placement</option>
            <option value="Holiday">Holiday</option>
          </select>
        </div>
        <div>
          <label>Priority</label>
          <select id="priority">
            <option value="normal">Normal</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
      <br />
      <button class="btn accent" id="submitBtn">Post Notice</button>
      <button class="btn ghost" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
    </div>

    <h2>All Notices</h2>
    <div id="adminNoticeList" class="notice-list">
      <p class="empty-state">Loading...</p>
    </div>
  </div>

</main>

<footer>College Notice Board Announcement System &mdash; Minor Project</footer>

<script src="js/admin.js"></script>
</body>
</html>
